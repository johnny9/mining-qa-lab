[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-qa-lab"
version = "0.1.0"
description = "Durable Mining QA lab orchestration service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "BZM" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<0.116",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<0.35",
]

[project.scripts]
miner-orchestrator = "mining_qa_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mining_qa_lab = ["orchestrator.example.yaml"]
